[package]
name = "alyze"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "High-performance text analysis for full-text search"
license = "MIT"
repository = "https://github.com/turbopuffer/alyze"
keywords = ["tokenizer", "unicode", "segmentation", "analysis", "nlp"]
categories = ["text-processing", "internationalization"]
exclude = ["testdata/", "benches/"]

[features]
default = ["icu-properties"]
icu-properties = ["dep:icu_properties"]
tpuf-vendored = ["dep:tpuf_icu_properties_211"]

[dependencies]
icu_properties = { version = "2.1.2", optional = true }
tpuf_icu_properties_211 = { version = "7", optional = true }

[dev-dependencies]
criterion = "0.8.2"
itertools = "0.14.0"
parquet = "57.3.0"
tempfile = "3.25.0"
ureq = "3.2.0"

[[bench]]
name = "wikipedia"
harness = false
