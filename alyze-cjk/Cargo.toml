[package]
name = "alyze-cjk"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "CJK (Chinese, Japanese, Korean) text analysis for alyze"
license = "Apache-2.0"
repository = "https://github.com/turbopuffer/alyze"
keywords = ["tokenizer", "cjk", "segmentation", "analysis", "nlp"]
categories = ["text-processing", "internationalization"]
exclude = ["testdata/", "benches/"]
# Not yet published. Must be published before an `alyze` release that ships the `cjk` feature,
# since `cargo publish` requires optional path dependencies to exist on crates.io too.
publish = false

# Pulled into `alyze` as an optional dependency behind its `cjk` feature. Kept as a separate crate
# so the dictionaries (`data/`: smartcn ~4.7 MB, nori ~26 MB uncompressed) don't inflate `alyze`
# for users who don't need them, and because unlike the MIT-licensed `alyze` it derives from Apache
# Lucene (see NOTICE).
# TODO(size): compress the nori dictionaries before publishing; crates.io caps a crate at 10 MB.

[dependencies]
rust-stemmers = "1.2.0"
tpuf_icu_properties_211 = "7"

[dev-dependencies]
criterion = "0.8.2"
parquet = "57.3.0"

[[bench]]
name = "wikipedia_zh"
harness = false

[[bench]]
name = "wikipedia_ko"
harness = false
