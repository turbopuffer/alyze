[package]
name = "alyze-cjk"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "CJK (Chinese, Japanese, Korean) text analysis for alyze"
license = "Apache-2.0"
repository = "https://github.com/turbopuffer/alyze"
keywords = ["tokenizer", "cjk", "segmentation", "analysis", "nlp"]
categories = ["text-processing", "internationalization"]
exclude = ["testdata/", "benches/"]
# Not yet published. Must be published before an `alyze` release that ships the `cjk` feature,
# since `cargo publish` requires optional path dependencies to exist on crates.io too.
publish = false

# Pulled into `alyze` as an optional dependency behind its `cjk` feature. Kept as a separate crate
# so the dictionaries (`data/`: smartcn ~4.7 MB, nori ~26 MB, kuromoji ~13 MB uncompressed) don't inflate `alyze`
# for users who don't need them, and because unlike the MIT-licensed `alyze` it derives from Apache
# Lucene (see NOTICE).
# TODO(size): compress the nori and kuromoji dictionaries before publishing; crates.io caps a
# crate at 10 MB.

[features]
default = ["smartcn", "nori", "kuromoji"]
smartcn = ["dep:rust-stemmers", "dep:tpuf_icu_properties_211"]
nori = ["dep:fst", "dep:tpuf_icu_properties_211"]
kuromoji = ["dep:fst", "dep:tpuf_icu_properties_211"]

[dependencies]
fst = { version = "0.4.7", optional = true }
rust-stemmers = { version = "1.2.0", optional = true }
tpuf_icu_properties_211 = { version = "7", optional = true }

[dev-dependencies]
criterion = "0.8.2"
parquet = "57.3.0"

[[bench]]
name = "wikipedia_zh"
harness = false
required-features = ["smartcn"]

[[bench]]
name = "wikipedia_ko"
harness = false
required-features = ["nori"]

[[bench]]
name = "wikipedia_ja"
harness = false
required-features = ["kuromoji"]

[[example]]
name = "kuromoji_convert_dict"
required-features = ["kuromoji"]

[[example]]
name = "kuromoji_gen_fuzz"
required-features = ["kuromoji"]

[[example]]
name = "kuromoji_profile"
required-features = ["kuromoji"]

[[example]]
name = "kuromoji_wiki_sample"
required-features = ["kuromoji"]

[[example]]
name = "nori_convert_dict"
required-features = ["nori"]

[[example]]
name = "nori_gen_fuzz"
required-features = ["nori"]

[[example]]
name = "nori_profile"
required-features = ["nori"]

[[example]]
name = "nori_wiki_sample"
required-features = ["nori"]

[[example]]
name = "smartcn_convert_dicts"
required-features = ["smartcn"]

[[example]]
name = "smartcn_gen_fuzz"
required-features = ["smartcn"]

[[example]]
name = "smartcn_wiki_sample"
required-features = ["smartcn"]
